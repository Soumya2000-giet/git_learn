<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login Page</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="login-container">
    <h1>Login</h1>

    <!-- LOGIN FORM -->
    <form id="login-form" onsubmit="handleFormSubmit(event)">
      <div class="input-group">
        <label for="email">Email</label>
        <input type="email" id="email" name="email" placeholder="Enter your email" required />
      </div>

      <div class="input-group">
        <label for="password">Password</label>
        <input type="password" id="password" name="password" placeholder="Enter your password" required />
      </div>

      <button type="submit" id="login-btn">Login</button>
    </form>

    <!-- FORGOT PASSWORD BUTTON -->
    <p style="margin-top: 10px;">
      <button type="button" onclick="showForgotPasswordForm()" style="background:none;border:none;color:blue;cursor:pointer;">
        Forgot Password?
      </button>
    </p>

    <!-- FORGOT PASSWORD FORM (HIDDEN INITIALLY) -->
    <form id="forgot-password-form" style="display:none;" onsubmit="handleForgotPassword(event)">
      <div class="input-group">
        <label for="forgot-email">Enter your email</label>
        <input type="email" id="forgot-email" required />
      </div>
      <button type="submit">Submit</button>
    </form>

    <div class="signup-link">
      <p>New user? <a href="signup.html">Sign up here</a></p>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/axios/1.5.1/axios.min.js"></script>
  <script src="login.js"></script>
</body>
</html>
