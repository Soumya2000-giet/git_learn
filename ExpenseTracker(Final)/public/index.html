<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <script src="https://sdk.cashfree.com/js/v3/cashfree.js"></script>
     <style>
        #premiumBtn {
            position: absolute;
            top: 20px;
            right: 20px;
            padding: 10px 20px;
            background: gold;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-weight: bold;
        }
        #premiumMsg {
            margin-top: 10px;
            font-size: 18px;
            color: green;
            font-weight: bold;
        }
        #leaderboardBtn {
            display: none;
            padding: 10px;
            background: purple;
            color: white;
            border: none;
            border-radius: 5px;
            margin-top: 10px;
        }
        
        #aiExpenseBtn {
        margin-left: 10px;
        padding: 8px 14px;
        background: #1e90ff;
        color: white;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        font-weight: bold;
        }
    </style>
</head>
<body>
    <button id="premiumBtn">Buy Premium</button>
    <p id="premiumMsg"></p>
    <form id="expenseform" onsubmit="handleFormSubmit(event)">
        <label for ="amount">Choose Expense Amount:</label>
        <input type="number" id="amount" name = "amount"  autocomplete="off">
        <label for ="desc">Choose Description:</label>
        <input type="text" id="desc" name = "desc" autocomplete="off">
        <label for ="expense_type">Choose a category:</label>
        <select id="expense_type" name ="expense_type">
            <option value="food">food</option>
            <option value="fuel">fuel</option>
            <option value="shopping">shopping</option>
            <option value="movie">movie</option>        
        </select>
        <button type="submit" id ="btn">Add Expense</button>
        <button type="button" id="aiExpenseBtn">🧠 AI Categorize</button>
         <button id="leaderboardBtn">Leaderboard</button>
         <div id="leaderboardContainer"></div>
        <ul>
        </ul>
    </form>
</body>
<script src="https://cdnjs.cloudflare.com/ajax/libs/axios/1.5.1/axios.min.js"></script>
<script src="index.js">
</script>
</html>
